name: Keep development branch
on:
  delete:
  workflow_run:
    workflows: ["Release main"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: keep-development
  cancel-in-progress: false

jobs:
  ensure-development:
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && github.event.ref == 'development')
    runs-on: ubuntu-latest
    steps:
      - name: Restore the integration branch only from a merged release
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            try {
              await github.rest.git.getRef({owner, repo, ref: 'heads/development'});
              core.info('development exists; no action required.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: main} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const merged = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', base: 'main', per_page: 100
            });
            const evidence = merged.some(pr =>
              pr.head.ref === 'development' &&
              pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pr.merged_at &&
              pr.merge_commit_sha === main.commit.sha
            );
            if (!evidence) {
              core.setFailed('Missing development branch: current main is not proven to be its merged successor. Restore manually from an audited SHA.');
              return;
            }
            try {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/development', sha: main.commit.sha
              });
              core.info('Restored development from merged main ' + main.commit.sha);
            } catch (error) {
              if (error.status !== 422) throw error;
              const current = await github.rest.git.getRef({owner, repo, ref: 'heads/development'});
              core.info('Concurrent restoration completed at ' + current.data.object.sha);
            }
