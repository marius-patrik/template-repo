name: Synchronize repository Canvas
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'agent/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canvas-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify canonical source documents
        run: python3 .github/scripts/generate_documents.py --check
      - name: Render complete Canvas from repository source
        run: |
          python3 .agents/tools/canvas.py render
          python3 .agents/tools/canvas.py check
      - name: Run repository behavior tests
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Commit updated Canvas projection
        run: |
          set -euo pipefail
          if git diff --quiet -- canvas.html; then
            echo "Canvas already matches repository source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- canvas.html
          git commit -m "docs(canvas): synchronize generated repository view"
          git push origin "HEAD:${GITHUB_REF_NAME}"
