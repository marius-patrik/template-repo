name: Bump version on PR
on:
  pull_request_target:
    branches: [development, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  version-bump:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Bump the PR head exactly once
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const {owner, repo} = context.repo;
            const configFile = await github.rest.repos.getContent({
              owner, repo, path: 'repo.dfconfig', ref: pr.base.sha
            });
            const config = JSON.parse(Buffer.from(configFile.data.content, 'base64').toString('utf8'));
            const mode = config.repo.versioning?.mode ?? 'tags';
            if (mode === 'tags') {
              core.info('Tag-only mode: no VERSION file or PR bump is required.');
              return;
            }
            if (mode !== 'file') throw new Error('Unknown version mode: ' + mode);
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.notice('Fork PR: cannot write to its head; update VERSION manually.');
              return;
            }
            if (pr.base.ref === 'main' && pr.head.ref !== 'development') {
              core.notice('PR violates main source policy; do not mutate its branch.');
              return;
            }
            const marker = 'chore(release): bump VERSION for PR #' + pr.number;
            const dispatchChecks = async () => {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'docs.yml', ref: pr.head.ref,
              });
              if (pr.base.ref === 'main') {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'main-source.yml',
                  ref: pr.head.ref, inputs: {pr_number: String(pr.number)},
                });
              }
            };
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            if (commits.some(c => c.commit.message.split('\n')[0] === marker)) {
              core.info('This PR was already bumped; reconcile checks on the current head.');
              await dispatchChecks();
              return;
            }
            const read = async (ref) => {
              const {data} = await github.rest.repos.getContent({owner, repo, path: 'VERSION', ref});
              if (!('content' in data)) throw new Error('VERSION is not a file');
              return {sha: data.sha, value: Buffer.from(data.content, 'base64').toString('utf8').trim()};
            };
            const parse = (value) => {
              if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value)) {
                throw new Error('Invalid VERSION: ' + value);
              }
              return value.split('.').map(Number);
            };
            const base = parse((await read(pr.base.sha)).value);
            const head = await read(pr.head.sha);
            const candidate = parse(head.value);
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
              return 0;
            };
            const next = [...(compare(base, candidate) > 0 ? base : candidate)];
            next[2]++;
            const newVersion = next.join('.') + '\n';
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'VERSION', branch: pr.head.ref,
              sha: head.sha, message: marker,
              content: Buffer.from(newVersion).toString('base64'),
            });
            core.info('Bumped VERSION to ' + newVersion.trim());
            await dispatchChecks();
