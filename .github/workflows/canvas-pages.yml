name: Canvas — GitHub Pages
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main, 'feat/canvas-react-pages']
    paths:
      - '.github/app/**'
      - '.github/workflows/canvas-pages.yml'
      - '.agents/**'
      - 'AGENTS.md'
      - 'repo.dfconfig'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Preview the exact feature-branch head, not a synthetic PR merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
      - uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install and compile Canvas
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bun run context
          bun run typecheck
          bun run lint
          bun run format:check
          bun run build
      - name: Check compiled Pages application HTML
        run: |
          node .github/app/scripts/verify-build.mjs .canvas-dist/index.html
          test -s .canvas-dist/index.html
          grep -q '</html>' .canvas-dist/index.html
          touch .canvas-dist/.nojekyll
      - name: Smoke test compiled HTML in Chromium
        working-directory: .github/app
        run: |
          bunx playwright install --with-deps chromium
          node ../tests/smoke_canvas.mjs ../../.canvas-dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .canvas-dist

  deploy:
    # Only trusted same-repository Canvas PRs may publish unmerged previews.
    # Pull-request builds previously passed while deployment was always skipped.
    if: >-
      github.event.repository.private == false &&
      (
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/canvas-react-pages')
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/canvas-react-pages' &&
          github.event.pull_request.base.ref == 'development'
        )
      )
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'canvas-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
