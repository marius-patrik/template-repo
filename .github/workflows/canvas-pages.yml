name: Canvas Quality

on:
  pull_request:
    branches: [development, main]
  push:
    branches: ['**']
    paths:
      - '.github/app/**'
      - '.github/tests/**'
      - '.github/workflows/canvas-pages.yml'
      - '.agents/**'
      - 'AGENTS.md'
      - 'repo.dfconfig'
  workflow_dispatch:

# No Pages or OIDC authority exists in this workflow, including for same-repo PRs.
# Production publication belongs to the separately reviewed release workflow.
permissions:
  contents: read

concurrency:
  group: canvas-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canvas-quality:
    # Dispatch is only for the integration branch. Feature branches are checked
    # via push/PR events and cannot use dispatch as an alternate execution path.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/development'
    name: canvas-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # PR builds test the merge candidate, not unreviewed head-only state.
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate workflow security and repository Python tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s .github/tests -p 'test_*.py'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install and compile Canvas
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bun run context
          bun run typecheck
          bun run lint
          bun run format:check
          bun run build
      - name: Check compiled Canvas application HTML
        run: |
          node .github/app/scripts/verify-build.mjs .canvas-dist/index.html
          test -s .canvas-dist/index.html
          grep -q '</html>' .canvas-dist/index.html
          touch .canvas-dist/.nojekyll
      - name: Smoke test compiled HTML in Chromium
        working-directory: .github/app
        run: |
          bunx playwright install --with-deps chromium
          node ../tests/smoke_canvas.mjs ../../.canvas-dist/index.html
      - name: Retain PR build for inspection (not a Pages deployment)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: canvas-pr-preview
          path: .canvas-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
