name: Canvas — GitHub Pages
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main, 'feat/canvas-react-pages']
    paths:
      - '.github/app/**'
      - '.github/workflows/canvas-pages.yml'
      - '.agents/**'
      - 'AGENTS.md'
      - 'repo.dfconfig'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install and compile Canvas
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bun run context
          bun run typecheck
          bun run lint
          bun run format:check
          bun run build
      - name: Check compiled site and standalone HTML
        run: |
          test -s .canvas-dist/index.html
          grep -q '</html>' .canvas-dist/index.html
          cp .canvas-dist/index.html .canvas-dist/canvas.html
          touch .canvas-dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .canvas-dist

  deploy:
    if: github.event.repository.private == false && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/canvas-react-pages') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'canvas-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
