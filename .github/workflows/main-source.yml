name: Main source policy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate after a bot-authored bump
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  main-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only development in this repository may target main
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let pr = context.payload.pull_request;
            if (!pr) {
              const number = Number(context.payload.inputs?.pr_number);
              if (!Number.isSafeInteger(number) || number <= 0) {
                throw new Error('A valid PR number is required.');
              }
              pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            }
            if (pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo ||
                pr.head.ref !== 'development') {
              core.setFailed('PRs to main may originate only from this repository\'s development branch.');
              return;
            }
            core.info('Authorized main PR: #' + pr.number + ' from development.');
