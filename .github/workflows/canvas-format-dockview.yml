name: Canvas — format dockable workspace
on:
  push:
    branches: [feat/canvas-react-pages]
    paths:
      - '.github/app/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canvas-format-dockview-once
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-react-pages
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Format Dockview source
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bunx biome format --write .
      - name: Commit source formatting
        run: |
          set -euo pipefail
          git add -u -- .github/app
          if git diff --cached --quiet; then
            echo 'Formatting is clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(canvas): format dockable application shell'
          git pull --rebase origin feat/canvas-react-pages
          git push origin HEAD:feat/canvas-react-pages
