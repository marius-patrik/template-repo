name: Format Canvas sidebar interaction
on:
  push:
    branches: [feat/canvas-react-pages]
    paths:
      - '.github/workflows/canvas-format-sidebar.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.11'}
      - name: Format sidebar hook
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bunx biome format --write src/SidebarResize.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- .github/app/src; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/app/src
          git commit -m 'style(canvas): normalize resize handler formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
