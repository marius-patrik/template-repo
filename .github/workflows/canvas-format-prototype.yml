name: Normalize Canvas profile prototype
on:
  push:
    branches: [feat/canvas-react-pages]
    paths: ['.github/app/**']
permissions:
  contents: write
concurrency:
  group: canvas-prototype-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Format with pinned Biome
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bunx biome format --write .
      - name: Commit normalization
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/app; then
            echo 'No formatting changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/app
          git commit -m 'style(canvas): normalize profile-first UI prototype'
          git push origin "HEAD:${GITHUB_REF_NAME}"
