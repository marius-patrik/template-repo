name: Format Canvas prototype sources
on:
  push:
    branches: [feat/canvas-react-pages]
    paths:
      - '.github/app/**'
      - '.github/workflows/canvas-format-prototype.yml'
permissions:
  contents: write
concurrency:
  group: canvas-onetime-formatter
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Format app
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bunx biome format --write .
      - name: Commit formatting
        run: |
          if git diff --quiet -- .github/app; then
            echo 'Source already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/app
          git commit -m 'style(canvas): format consolidated interface sources'
          git push origin "HEAD:${GITHUB_REF_NAME}"
