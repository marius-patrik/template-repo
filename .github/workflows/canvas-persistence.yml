name: Canvas persistence acceptance

on:
  pull_request:
    branches: [development, main]
    paths:
      - '.github/app/src/domain/**'
      - '.github/app/src/persistence/**'
      - '.github/tests/persistence/**'
      - '.github/workflows/canvas-persistence.yml'
      - '.github/app/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install application test dependencies
        working-directory: .github/app
        run: bun install --frozen-lockfile
      - name: Run domain contract tests
        run: node .github/tests/persistence/domain-contract.mjs
      - name: Install Chromium
        working-directory: .github/app
        run: bunx playwright install --with-deps chromium
      - name: Verify real IndexedDB transactions in Chromium
        run: node .github/tests/persistence/canvas-persistence.mjs
      - name: D01 temporary Biome output proof (branch-scoped)
        if: ${{ github.head_ref == 'agent/canvas-c01-idb-foundation' }}
        working-directory: .github/app
        run: |
          bunx biome format --write src/domain src/persistence
          for path in src/domain/errors.ts src/domain/types.ts src/persistence/README.md src/persistence/index.ts src/persistence/indexeddb.ts src/persistence/validation.ts; do
            printf 'D01_BLOB %s ' "$path"
            base64 -w0 "$path"
            printf '\n'
          done
