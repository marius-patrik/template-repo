name: Canvas visual review
on:
  push:
    branches: [feat/canvas-react-pages]
    paths:
      - '.github/workflows/canvas-review.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.11'}
      - name: Build and capture views
        working-directory: .github/app
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx playwright install --with-deps chromium
          node scripts/capture-visual.mjs ../../.canvas-dist/index.html
      - name: Store visual-review captures on prototype branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .github/app/review/*.png
          git commit -m 'test(canvas): capture interactive interface for visual audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"
