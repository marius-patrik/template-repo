# df-control-bridge: 1
# The default-branch runtime still handles issue/approval automation.
# Keep PR quality tokens read-only; never inherit agent secrets into it.
name: DarkFactory Runtime
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

jobs:
  governed-quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/darkfactory-control.yml
    with:
      mode: quality

  governed-agent:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      repository-projects: write
    uses: ./.github/workflows/darkfactory-control.yml
    with:
      mode: agent
    secrets: inherit

  governed-approvals:
    if: github.event_name == 'pull_request_review' || github.event_name == 'issue_comment'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      repository-projects: write
    uses: ./.github/workflows/darkfactory-control.yml
    with:
      mode: approvals
    secrets: inherit
